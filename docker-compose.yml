services:

  # 服务名
  autosys:
    # 指定容器名称
    container_name: autosys
    # 指定为镜像名称或镜像ID
    image: iflyelf/autosys:latest
    # 国内推荐改用华为云 SWR:
    # image: swr.cn-east-3.myhuaweicloud.com/iflyelf/autosys:latest
    # 指定容器退出后的重启策略为始终重启
    restart: always
    # 端口映射 (使用 network_mode: host 时删除)
    ports:
      - "3000:3000"
    # 数据卷所挂载路径设置
    volumes:
      # 配置文件 (config.json / requirements.txt)
      - ./config:/etc/autosys
      # SQLite 数据库
      - ./data:/var/lib/autosys
      # 同步宿主机时区与时间
      - /etc/localtime:/etc/localtime:ro
    # 环境变量
    environment:
      TZ: Asia/Shanghai
      # 数据库: sqlite / mysql / postgres
      SEMAPHORE_DB_DIALECT: sqlite
      # 使用 mysql / postgres 时设置:
      # SEMAPHORE_DB_HOST: mysql:3306
      # SEMAPHORE_DB_USER: autosys
      # SEMAPHORE_DB_PASS: change-me
      # SEMAPHORE_DB: autosys
      # 首次启动创建的管理员
      SEMAPHORE_ADMIN: admin
      SEMAPHORE_ADMIN_PASSWORD: change-me
      SEMAPHORE_ADMIN_NAME: 管理员
      SEMAPHORE_ADMIN_EMAIL: admin@localhost
      # 密钥加密 key, 生成: head -c32 /dev/urandom | base64
      # SEMAPHORE_ACCESS_KEY_ENCRYPTION: <base64 32 字节>
      SEMAPHORE_SCHEDULE_TIMEZONE: Asia/Shanghai
    # 指定容器的 ulimits 限制值
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
