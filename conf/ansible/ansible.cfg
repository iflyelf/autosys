[defaults]
# 主机信息收集策略: smart = 已收集过则跳过
gathering = smart
# 收集主机信息超时时间(秒)
gather_timeout = 10
# 最大并发主机数
forks = 30
# 不校验 SSH 主机密钥 (容器内为一次性环境)
host_key_checking = False
# 不展示跳过的主机
display_skipped_hosts = False
# 不展示弃用警告
deprecation_warnings = False
# 目标主机 python 解释器: 自动探测 python3 / 3.13 / 3.12 ... 且不告警
# 注意: 不能写死 /usr/bin/python, Ubuntu 22.04+ / Debian 12+ 默认没有该路径
interpreter_python = auto_silent
# 启用 ansible 自带回调插件
bin_ansible_callbacks = True
# 默认回调插件 + YAML 格式输出
# 注意: 2.19 起旧的 stdout_callback = yaml 已移除, 对应写法是 callback_result_format = yaml
stdout_callback = ansible.builtin.default
callback_result_format = yaml
# 强制彩色输出 (平台日志页支持 ANSI 颜色渲染)
force_color = True

[ssh_connection]
# SSH 连接复用参数
ssh_args = -o ControlMaster=auto -o ControlPersist=3s -o ServerAliveInterval=3 -o ServerAliveCountMax=5
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
# 减少 SSH 连接次数
pipelining = True
# 文件传输方式: smart = 优先 sftp, 不可用时回退 scp
# 注意: 2.17 起 scp_if_ssh 已移除, 只用 transfer_method
transfer_method = smart
