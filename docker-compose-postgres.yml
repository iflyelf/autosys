#=================================================
#  autosys + PostgreSQL（iflyelf/postgres）
#  启动: cp .env.example .env && docker compose -f docker-compose-postgres.yml up -d
#
#  说明:
#   - 数据库镜像与目录结构沿用 postgres-docker 项目: iflyelf/postgres,
#     PGDATA=/data/postgres/data, 启动时按容器 CPU/内存自动调优, 初始化使用中文 UTF-8 locale
#   - 网络为 autosys 专用(桥名 autosys_pg_net), 固定 IPv4 + IPv6;
#     网段避让 postgres-docker(172.22.0/1)、mysql-docker(172.21.4/5)、php-docker(172.21.0):
#       autosys_pg_net = 172.22.7.0/24 + fe9a:7::/64
#   - 数据库端口默认不映射到宿主机(仅容器内互访), 需要外部连接时取消注释 ports
#   - 默认密码 ysyh!9Sky, 生产环境请在 .env 中修改
#=================================================
name: autosys-postgres

services:

  # ---------------------------------------------------------------
  #  PostgreSQL 数据库
  # ---------------------------------------------------------------
  postgres:
    # 模拟一个伪终端
    tty: true
    # 打开标准输入, 可以接受外部输入
    stdin_open: true
    # 主机名(autosys 通过该名称连接)
    hostname: postgres
    # 指定容器名称
    container_name: autosys-postgres
    # 指定为镜像名称或镜像ID
    # Docker Hub:   iflyelf/postgres:latest
    # 华为云 SWR:   swr.cn-east-3.myhuaweicloud.com/iflyelf/postgres:latest
    image: iflyelf/postgres:latest
    # 以 root 启动: 修正宿主挂载目录(默认 root 属主)的属主后自动降权到 postgres
    user: "0:0"
    # 指定容器退出后的重启策略为始终重启
    restart: always
    # 数据卷所挂载路径设置
    volumes:
      # 数据目录(含 pg_hba.conf / postgresql.conf)
      - ./data/postgres:/data/postgres/data:rw,cached
      # WAL 归档目录
      - ./archive/postgres:/data/postgres/archive:rw,cached
      # 日志目录(csvlog 输出)
      - ./logs/postgres:/data/postgres/logs:rw,cached
      # 同步宿主机时区与时间
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro,cached
      - /etc/localtime:/etc/localtime:ro,cached
    # 环境变量
    environment:
      # ---------- 初始化必填 ----------
      # 超级用户密码
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ysyh!9Sky}
      # 超级用户(autosys 用该账号连接)
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # 初始化时自动创建的业务库
      POSTGRES_DB: ${POSTGRES_DB:-autosys}
      # 初始化参数: 统一使用中文 UTF-8 locale
      POSTGRES_INITDB_ARGS: "-E UTF8 --lc-collate=zh_CN.UTF-8 --lc-ctype=zh_CN.UTF-8 --lc-messages=zh_CN.UTF-8 --lc-monetary=zh_CN.UTF-8 --lc-numeric=zh_CN.UTF-8 --lc-time=zh_CN.UTF-8"
      # ---------- 自动调优(可选) ----------
      # 手动指定 CPU / 内存上限(支持 8Gi/4096Mi/4/500m), 不设置则自动从 cgroup 探测
      PG_MEMORY_LIMIT: ${PG_MEMORY_LIMIT:-}
      PG_CPU_LIMIT: ${PG_CPU_LIMIT:-}
      # 直接指定连接数, 不设置则按内存/CPU 自动计算
      PG_MAX_CONNECTIONS: ${PG_MAX_CONNECTIONS:-}
      # ---------- 本地化 ----------
      TZ: ${TZ:-Asia/Shanghai}
      LANG: ${LANG:-zh_CN.UTF-8}
    # 共享内存: PostgreSQL 并行查询/大排序需要
    shm_size: 1gb
    # 配置容器连接的网络
    networks:
      autosys_pg_net:
        ipv4_address: 172.22.7.2
        ipv6_address: fe9a:7::2
    # 暴露端口信息(默认不映射; 需要宿主机直连时取消注释)
    # ports:
    # - "5432:5432"
    # 健康检查: 调优配置生成完成且数据库可接受连接才算健康
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-autosys} -h 127.0.0.1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    # 指定容器的 ulimits 限制值
    ulimits:
      nproc: 65535
      nofile:
          soft: 65535
          hard: 65535

  # ---------------------------------------------------------------
  #  autosys 自动化平台
  # ---------------------------------------------------------------
  autosys:
    # 模拟一个伪终端
    tty: true
    # 打开标准输入, 可以接受外部输入
    stdin_open: true
    # 主机名
    hostname: autosys
    # 指定容器名称
    container_name: autosys
    # 指定为镜像名称或镜像ID
    # Docker Hub:   iflyelf/autosys:latest
    # 华为云 SWR:   swr.cn-east-3.myhuaweicloud.com/iflyelf/autosys:latest
    image: ${AUTOSYS_IMAGE:-iflyelf/autosys:latest}
    # 指定容器退出后的重启策略为始终重启
    restart: always
    # 数据卷所挂载路径设置
    volumes:
      # 配置文件(config.json / requirements.txt)
      - ./config:/etc/autosys:rw,cached
      # SQLite 数据库与临时数据(使用 PostgreSQL 时仅存放临时文件)
      - ./data/autosys:/var/lib/autosys:rw,cached
      # 同步宿主机时区与时间
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro,cached
      - /etc/localtime:/etc/localtime:ro,cached
    # 环境变量
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # ---------- 数据库 ----------
      SEMAPHORE_DB_DIALECT: postgres
      # 通过服务名走容器网络
      SEMAPHORE_DB_HOST: postgres:5432
      SEMAPHORE_DB_USER: ${POSTGRES_USER:-postgres}
      SEMAPHORE_DB_PASS: ${POSTGRES_PASSWORD:-ysyh!9Sky}
      SEMAPHORE_DB: ${POSTGRES_DB:-autosys}
      # ---------- 首次启动创建的管理员 ----------
      SEMAPHORE_ADMIN: ${SEMAPHORE_ADMIN:-admin}
      SEMAPHORE_ADMIN_PASSWORD: ${SEMAPHORE_ADMIN_PASSWORD:-ysyh!9Sky}
      SEMAPHORE_ADMIN_NAME: ${SEMAPHORE_ADMIN_NAME:-管理员}
      SEMAPHORE_ADMIN_EMAIL: ${SEMAPHORE_ADMIN_EMAIL:-admin@localhost}
      # 密钥存储加密 key(强烈建议设置, 生成: head -c32 /dev/urandom | base64)
      SEMAPHORE_ACCESS_KEY_ENCRYPTION: ${SEMAPHORE_ACCESS_KEY_ENCRYPTION:-}
      # 计划任务时区
      SEMAPHORE_SCHEDULE_TIMEZONE: ${TZ:-Asia/Shanghai}
    # 配置容器连接的网络
    networks:
      autosys_pg_net:
        ipv4_address: 172.22.7.3
        ipv6_address: fe9a:7::3
    # 暴露端口信息
    ports:
    - "${AUTOSYS_PORT:-3000}:3000"
    # 解决容器的依赖(等数据库健康后再启动)
    depends_on:
      postgres:
        condition: service_healthy
    # 指定容器的 ulimits 限制值
    ulimits:
      nproc: 65535
      nofile:
          soft: 65535
          hard: 65535

networks:
  # 网络名称/桥名以组件名 autosys_ 开头, 网段避让 pg / mysql / php 等项目已占用段
  autosys_pg_net:
    driver: bridge
    enable_ipv6: true
    driver_opts:
      com.docker.network.bridge.name: autosys_pg_net
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_forwarding: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.bridge.host_binding_ipv4: "0.0.0.0"
      com.docker.network.bridge.host_binding_ipv6: "::/0"
      com.docker.network.driver.mtu: 1500
    ipam:
      driver: default
      config:
      - subnet: 172.22.7.0/24
        gateway: 172.22.7.1
      - subnet: fe9a:7::/64
        gateway: fe9a:7::1
